name: Deploy to Production

# Triggers a Vercel production deploy ONLY after the CI workflow succeeds
# on `main`. This is the "Vercel chờ CI" gate — we disable Vercel's
# auto-deploy on push for the `main` branch (see SETUP below) and let CI
# run first; only when every CI step (type check, lint, test, build)
# passes do we hit the Vercel Deploy Hook.
#
# Feature-branch / PR previews continue to deploy automatically through
# Vercel's normal Git integration — they're isolated and rebuilding them
# on every CI pass would waste minutes.
#
# ─── SETUP (one-time, after first push of this workflow) ─────────────────
#
# 1. **Disable Vercel auto-deploy on `main`**
#    Vercel Dashboard → Project Settings → Git → Ignored Build Step.
#    Paste this command (skips builds on main; allows preview branches):
#
#        [ "$VERCEL_GIT_COMMIT_REF" = "main" ] && exit 0 || exit 1
#
#    `exit 0` = skip build, `exit 1` = proceed.
#
# 2. **Create a Deploy Hook for `main`**
#    Vercel Dashboard → Project Settings → Git → Deploy Hooks →
#    Create Hook (Name: "GH Actions main", Branch: "main") → copy URL.
#
# 3. **Add the URL as a GitHub secret**
#    GitHub repo → Settings → Secrets and variables → Actions → New
#    repository secret. Name: `VERCEL_DEPLOY_HOOK`, value: paste URL.
#
# After those 3 steps, every push to `main` will:
#   - Run CI (this workflow waits for it)
#   - If CI green → POST to deploy hook → Vercel builds + deploys prod
#   - If CI red  → no deploy, prod stays on the previous green commit
#
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  trigger-vercel:
    name: Trigger Vercel production deploy
    runs-on: ubuntu-latest
    # Only proceed if the CI run that just completed was successful AND
    # was triggered by a push (not by another workflow_run, which would
    # cause infinite chaining).
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    timeout-minutes: 5

    steps:
      - name: Verify deploy hook is configured
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set. See SETUP comments in deploy-prod.yml."
            exit 1
          fi

      - name: POST to Vercel deploy hook
        run: |
          echo "CI passed for ${{ github.event.workflow_run.head_sha }} — triggering Vercel deploy"
          HTTP_STATUS=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Vercel response (HTTP $HTTP_STATUS):"
          cat /tmp/response.json
          if [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Vercel deploy hook returned non-2xx status"
            exit 1
          fi
