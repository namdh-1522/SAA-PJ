name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Strict gate — TypeScript errors break the build.
      - name: Type check
        run: npx tsc --noEmit

      # Non-blocking — there are 5 pre-existing React Compiler errors in Kudos
      # components (KudoLinkDialog, ImageLightbox, KudosDeptDropdown,
      # KudosHashtagDropdown, use-realtime-kudos). Surface them in the run
      # summary so they get attention, but don't block PRs until the team has
      # time to refactor. Once those are fixed, remove `continue-on-error`.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      # Strict gate — failing tests break the build.
      # Integration tests are skipped (they need a live Supabase + Docker;
      # add a separate job with `supabase/setup-cli` if/when needed).
      - name: Unit tests
        run: npm test

      # Strict gate — production build must succeed. Catches type errors
      # specific to next/server runtime that `tsc --noEmit` misses, and
      # surfaces issues with environment defaults.
      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders. The actual values are set on Vercel.
          # `app/page.tsx` and `proxy.ts` gracefully handle these at runtime
          # via `isSupabaseConfigured()`, but build-time `next build` benefits
          # from valid-looking values to avoid unnecessary noise.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_PRELAUNCH_END: 2025-01-01T00:00:00+07:00
          NEXT_PUBLIC_SAA_EVENT_START: 2026-07-07T18:30:00+07:00
